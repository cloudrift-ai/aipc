seq_write = { value = 5000.0, unit = "MB/s", evidence = "datasheet", source = "product brief, 2TB column" }
endurance = { value = 1200.0, unit = "TBW", evidence = "datasheet", source = "product brief, 2TB column" }

[[requires]]
