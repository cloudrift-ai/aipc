id = "ds18b20-waterproof-probe"
name = "DS18B20 waterproof probe (stainless tube, 3-wire cable)"
category = "purchased"
evidence = "datasheet"
notes = """
Generic probe around an Analog Devices (Maxim) DS18B20 sensor. The sensor values are
from the datasheet; the tube, cable length and wire colours vary by seller, so check
them against the listing you buy (usually red VDD, black GND, yellow or white DQ).
Powered from 3.3 V on three wires (not parasite mode). Both probes share one 1-Wire bus;
each has a unique 64-bit ROM code, which the firmware uses to tell intake from exhaust.
A reading of exactly 85.0 C is the sensor's power-on value and usually means a bad read.
"""

[[datasheets]]
title = "DS18B20 data sheet Rev. 6"
url = "https://www.analog.com/media/en/technical-documentation/data-sheets/DS18B20.pdf"

[model]
source = "constructed"
notes = "Tube envelope only."

[dims]
accuracy = { value = 0.5, unit = "C", evidence = "datasheet", source = "DS18B20 Rev. 6: +/-0.5 C from -10 to +85 C" }
supply_min = { value = 3.0, unit = "V", evidence = "datasheet", source = "DS18B20 Rev. 6: 3.0 to 5.5 V" }
conversion_time_12bit = { value = 750.0, unit = "ms", evidence = "datasheet", source = "DS18B20 Rev. 6: max conversion time at 12 bits" }
tube_diameter = { value = 6.0, evidence = "assumed", note = "typical probe; measure the one bought" }
tube_length = { value = 50.0, evidence = "assumed", note = "typical probe; measure the one bought" }
cable_length = { value = "", evidence = "unknown", note = "buy 1 m for the intake and 2 m for the exhaust probe, or as the cabinet needs" }

[[requires]]
type = "onewire-port"
value = "3.3 V, DQ, GND"
count = 1
