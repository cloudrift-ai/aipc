status = "candidate"
quantity = 1
systems = ["node"]
notes = """
Any SP3 EPYC 7002/7003 works; the 7702P is assumed here because Berserk runs
one. The CPU cooler is not chosen: the layout reserves a 100 mm envelope above the board.
"""

