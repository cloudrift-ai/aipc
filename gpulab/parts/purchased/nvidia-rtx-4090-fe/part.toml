id = "nvidia-rtx-4090-fe"
name = "NVIDIA GeForce RTX 4090 Founders Edition"
category = "purchased"
role = "GPU under test (flow-through cooler), 4 baseboard positions"
status = "candidate"
quantity = 1
systems = ["node"]
evidence = "datasheet"
notes = """
Same flow-through layout as the 3090 FE.
Occupies 4 positions (thickness plus 15-25 mm air gap at the 20.32 mm pitch).
Running on an MCIO riser at x8; values marked review/listing are provisional.
"""

[links]
product = "https://www.nvidia.com/en-us/geforce/graphics-cards/40-series/rtx-4090/"

[[datasheets]]
title = "NVIDIA RTX 4090 specifications"
url = "https://www.nvidia.com/en-us/geforce/graphics-cards/40-series/rtx-4090/"

[model]
source = "constructed"
notes = "Body envelope only: length x height x thickness."

[dims]
length = { value = 304.0, evidence = "datasheet", source = "NVIDIA spec page" }
height = { value = 137.0, evidence = "datasheet", source = "NVIDIA spec page; KitGuru measured 147 mm" }
thickness = { value = 61.0, evidence = "datasheet", source = "NVIDIA spec page" }
tgp = { value = 450.0, unit = "W", evidence = "datasheet", source = "NVIDIA spec page" }
mass = { value = 2.19, unit = "kg", evidence = "review", source = "reviews 2.186 kg; Puget lists 2.254 kg" }

[[requires]]
type = "riser-x16-slot"
value = "PCIe x16"
count = 1
note = "PCIe 4.0 x16 card on an x8 riser link"

[[requires]]
type = "gpu-baseboard-position"
count = 4
evidence = "allowance"

[[requires]]
type = "12v-2x6"
count = 1
note = "16-pin 12VHPWR; a 12V-2x6 cable fits"

[[requires]]
type = "dc-power"
load = 450.0
evidence = "datasheet"
load_limited = 320.0
note = "stock board power, including the 75 W slot power drawn through the riser; capped to 320 W for the 2800 W PSU budget: nvidia-smi -i <gpu> -pl 320, set at boot and confirm the driver accepts it"

[assembly]
match = ["^GPU_nvidia_rtx_4090_fe$"]
