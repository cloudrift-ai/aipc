# ESPHome firmware for the rack fan controller (rack/docs/wiring.md).
#
# Board: Olimex ESP32-POE (WROOM-32E-N4), wired Ethernet, powered from the
# controller board's 5 V on EXT1 pin 1. PoE is not used; Wi-Fi is off.
#   Intake fans 1-4  -> PWM GPIO32, tach GPIO35, 36, 34, 4
#   Exhaust fans 5-8 -> PWM GPIO33, tach GPIO14, 5, 15, 16
#   DS18B20 probes   -> 1-Wire GPIO13 (the ESP32-POE's 2.2 kOhm pull-up)
# Ethernet (LAN8710A, fixed by the board): MDC 23, MDIO 18, clock out 17, PHY power 12.
#
# Control: both banks follow the hotter of two demands, the exhaust temperature
# and the intake-to-exhaust rise; the intake bank runs a few percent faster for a
# slight positive pressure. Fail-safe: full speed for the first 15 s, on any probe
# error and on any fan fault. The PWM outputs drive open-collector transistors, so
# a dead, resetting or unflashed ESP32 leaves the fans at full speed as well.
#
# First flash: copy secrets.example.yaml to secrets.yaml and fill it in. Pull the
# ESP32-POE out of its socket (USB and the board's 5 V must never both feed it) and
#   esphome run rack-fans.yaml
# over USB. Later updates go over Ethernet.
# The log lists the ROM code of each probe it finds on the bus; put them into
# intake_probe / exhaust_probe below (warm one probe in your hand to tell them
# apart) and flash again. Until then both read as unavailable and the fans run
# at full speed.

substitutions:
  intake_probe: "0x0000000000000000"
  exhaust_probe: "0x0000000000000000"
  # NF-A20 PWM: 2 tach pulses per revolution; never below ~310 rpm while powered.
  stall_rpm: "150"

esphome:
  name: rack-fans
  friendly_name: Rack fans
  comment: Cabinet fan controller, 4 intake + 4 exhaust NF-A20 PWM
  on_boot:
    priority: 800
    then:
      - output.set_level: { id: pwm_intake, level: 100% }
      - output.set_level: { id: pwm_exhaust, level: 100% }

esp32:
  board: esp32-poe
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

ethernet:
  type: LAN8720  # the board's LAN8710A uses the same driver
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

web_server:
  port: 80
  ota: false  # firmware updates only through the encrypted native OTA

one_wire:
  - platform: gpio
    pin: GPIO13

globals:
  - id: exhaust_level
    type: float
    initial_value: "1.0"

output:
  # Inverted: the GPIO drives a 2N3904 that pulls the fans' PWM line low.
  - platform: ledc
    id: pwm_intake
    pin: GPIO32
    frequency: 25000 Hz
    inverted: true
  - platform: ledc
    id: pwm_exhaust
    pin: GPIO33
    frequency: 25000 Hz
    inverted: true

number:
  - platform: template
    id: t_start
    name: Curve start (exhaust)
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 50
    step: 0.5
    initial_value: 30
    optimistic: true
    restore_value: true
  - platform: template
    id: t_full
    name: Curve full speed (exhaust)
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 25
    max_value: 60
    step: 0.5
    initial_value: 42
    optimistic: true
    restore_value: true
  - platform: template
    id: dt_start
    name: Curve start (rise)
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 20
    step: 0.5
    initial_value: 5
    optimistic: true
    restore_value: true
  - platform: template
    id: dt_full
    name: Curve full speed (rise)
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 2
    max_value: 30
    step: 0.5
    initial_value: 15
    optimistic: true
    restore_value: true
  - platform: template
    id: min_duty
    name: Minimum duty
    entity_category: config
    unit_of_measurement: "%"
    min_value: 20
    max_value: 100
    step: 1
    initial_value: 25
    optimistic: true
    restore_value: true
  - platform: template
    id: intake_bias
    name: Intake bias
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 20
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true

switch:
  - platform: template
    id: force_full
    name: Force full speed
    icon: mdi:fan-alert
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: dallas_temp
    id: t_in
    name: Intake temperature
    address: ${intake_probe}
    resolution: 12
    update_interval: 10s
  - platform: dallas_temp
    id: t_ex
    name: Exhaust temperature
    address: ${exhaust_probe}
    resolution: 12
    update_interval: 10s

  - platform: template
    id: t_rise
    name: Temperature rise
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: return id(t_ex).state - id(t_in).state;

  - platform: template
    id: duty_intake
    name: Intake duty
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return 100.0f * std::min(1.0f, id(exhaust_level) + id(intake_bias).state / 100.0f);
  - platform: template
    id: duty_exhaust
    name: Exhaust duty
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return 100.0f * id(exhaust_level);

  # Tachs: open collector, pulled up to 3.3 V on the controller board (header 8: by the
  # ESP32-POE's 2.2 kOhm on GPIO16). GPIO34-36 are input-only with no internal pull-up.
  # GPIO36 can see ~80 ns low glitches (ESP32 erratum 3.11); the 13 us filter drops them.
  - platform: pulse_counter
    id: rpm_in1
    name: Intake fan 1
    pin: { number: GPIO35, mode: { input: true } }
    unit_of_measurement: rpm
    internal_filter: 13us
    update_interval: 10s
    filters: [multiply: 0.5]
  - platform: pulse_counter
    id: rpm_in2
    name: Intake fan 2
    pin: { number: GPIO36, mode: { input: true } }
    unit_of_measurement: rpm
    internal_filter: 13us
    update_interval: 10s
    filters: [multiply: 0.5]
  - platform: pulse_counter
    id: rpm_in3
    name: Intake fan 3
    pin: { number: GPIO34, mode: { input: true } }
    unit_of_measurement: rpm
    internal_filter: 13us
    update_interval: 10s
    filters: [multiply: 0.5]
  - platform: pulse_counter
    id: rpm_in4
    name: Intake fan 4
    pin: { number: GPIO4, mode: { input: true } }
    unit_of_measurement: rpm
    internal_filter: 13us
    update_interval: 10s
    filters: [multiply: 0.5]
  - platform: pulse_counter
    id: rpm_ex1
    name: Exhaust fan 1
    pin: { number: GPIO14, mode: { input: true } }
    unit_of_measurement: rpm
    internal_filter: 13us
    update_interval: 10s
    filters: [multiply: 0.5]
  - platform: pulse_counter
    id: rpm_ex2
    name: Exhaust fan 2
    pin: { number: GPIO5, mode: { input: true }, ignore_strapping_warning: true }  # harmless at boot: docs/wiring.md
    unit_of_measurement: rpm
    internal_filter: 13us
    update_interval: 10s
    filters: [multiply: 0.5]
  - platform: pulse_counter
    id: rpm_ex3
    name: Exhaust fan 3
    pin: { number: GPIO15, mode: { input: true }, ignore_strapping_warning: true }  # harmless at boot: docs/wiring.md
    unit_of_measurement: rpm
    internal_filter: 13us
    update_interval: 10s
    filters: [multiply: 0.5]
  - platform: pulse_counter
    id: rpm_ex4
    name: Exhaust fan 4
    pin: { number: GPIO16, mode: { input: true } }
    unit_of_measurement: rpm
    internal_filter: 13us
    update_interval: 10s
    filters: [multiply: 0.5]

binary_sensor:
  - platform: template
    id: fan_fault
    name: Fan fault
    device_class: problem
    lambda: |-
      for (auto *s : {id(rpm_in1), id(rpm_in2), id(rpm_in3), id(rpm_in4),
                      id(rpm_ex1), id(rpm_ex2), id(rpm_ex3), id(rpm_ex4)}) {
        if (std::isnan(s->state) || s->state < ${stall_rpm}) return true;
      }
      return false;
    filters:
      - delayed_on: 30s
      - delayed_off: 30s
  - platform: template
    id: probe_fault
    name: Probe fault
    device_class: problem
    lambda: |-
      for (float t : {id(t_in).state, id(t_ex).state}) {
        // 85.0 C exactly is the DS18B20 power-on value: a failed conversion.
        if (std::isnan(t) || t < -20.0f || t > 100.0f || t == 85.0f) return true;
      }
      return false;

interval:
  - interval: 5s
    then:
      - lambda: |-
          auto ramp = [](float x, float lo, float hi) -> float {
            if (hi <= lo) return x >= hi ? 1.0f : 0.0f;
            return std::min(1.0f, std::max(0.0f, (x - lo) / (hi - lo)));
          };
          float level;
          if (millis() < 15000 || id(force_full).state || id(probe_fault).state || id(fan_fault).state) {
            level = 1.0f;
          } else {
            const float tin = id(t_in).state, tex = id(t_ex).state;
            const float floor = id(min_duty).state / 100.0f;
            const float demand = std::max(ramp(tex, id(t_start).state, id(t_full).state),
                                          ramp(tex - tin, id(dt_start).state, id(dt_full).state));
            level = floor + (1.0f - floor) * demand;
            // Speed up at once; slow down by at most 2% per 5 s step to avoid hunting.
            level = std::max(level, id(exhaust_level) - 0.02f);
          }
          id(exhaust_level) = level;
          id(pwm_exhaust).set_level(level);
          id(pwm_intake).set_level(std::min(1.0f, level + id(intake_bias).state / 100.0f));
