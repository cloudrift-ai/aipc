[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hwkit"
version = "0.1.0"
description = "Shared tooling for the hardware builds in this repo: part specs, compatibility checks, assembly registry, renders, print plates and slicing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # CadQuery pulls in OCP (OpenCascade); large download.
    "cadquery>=2.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    # Headless renders: VTK ships with CadQuery; Pillow composes the contact sheets.
    "vtk>=9.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
hwkit = "hwkit.cli:main"

[tool.setuptools.packages.find]
include = ["hwkit*"]

[tool.setuptools.package-data]
"hwkit.printers" = ["*/*.toml", "*/*.json", "*/*/*/*.json", "*/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
